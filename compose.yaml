services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reports
      POSTGRES_USER: report
      POSTGRES_PASSWORD: report
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U report -d reports"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://report:report@postgres:5432/reports
      ARTIFACT_DIR: /app/artifacts
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - report-artifacts:/app/artifacts

volumes:
  postgres-data:
  report-artifacts:
